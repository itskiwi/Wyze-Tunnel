<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyze Tunnel</title>
<style>
  /* Studio Soft, the same tokens as the web UI (ui/input.css). Dark is the default. */
  @font-face { font-family: "Nunito"; font-weight: 800; src: url(nunito-latin-800-normal.woff2) format("woff2"); }
  :root {
    color-scheme: dark;
    --bg: #0e100e; --card: #171a17; --line: #2a2f2a; --fg: #eef0ec; --muted: #a0a69c; --faint: #787e74;
    --accent: #3dcf8e; --accent-deep: #229a65; --on-accent: #052014; --warn: #fbbf24; --warn-bg: #fbbf241a;
    --ring: inset 0 0 0 1px #ffffff0d;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f5f4f0; --card: #fff; --line: #dedcd3; --fg: #1a1c19; --muted: #5d6058; --faint: #7d8076;
      --accent: #15895a; --accent-deep: #0e6b45; --on-accent: #fff; --warn: #b45309; --warn-bg: #b4530914;
      --ring: 0 1px 2px #0000000f, 0 10px 26px #282c2414;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 600px; margin: 0 auto; padding: 28px 20px; display: flex; flex-direction: column; gap: 14px; }
  main > button { align-self: flex-start; }
  header { display: flex; gap: 16px; align-items: center; margin-bottom: 6px; }
  h1 { margin: 0; font: 800 23px/1.2 Nunito, system-ui, sans-serif; letter-spacing: -.01em; }
  h2 { margin: 10px 0 10px; font: 800 14px/1 Nunito, system-ui, sans-serif; color: var(--muted); }
  p { color: var(--muted); margin: 2px 0 0; }
  .card { background: var(--card); border-radius: 22px; padding: 18px 20px; box-shadow: var(--ring); }
  button { font: 800 15px Nunito, system-ui, sans-serif; padding: 10px 22px; border: 0; border-radius: 999px; background: var(--accent);
    color: var(--on-accent); cursor: pointer; box-shadow: 0 4px 0 var(--accent-deep); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button.link { background: none; color: var(--accent); padding: 0 4px; box-shadow: none; font: inherit; font-weight: 600; }
  pre, .mono { font: 12px/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace; }
  pre { background: var(--card); color: var(--muted); border-radius: 14px; padding: 12px; max-height: 40vh; overflow: auto; white-space: pre-wrap; margin: 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  code { font-size: 15px; user-select: all; }
  [hidden] { display: none !important; }

  /* Tunnel, the mascot: blinks, and looks around while it works. Asleep while stopped. */
  .mascot { width: 60px; height: 60px; flex: none; }
  .eye { transform-origin: 22px 20px; animation: blink 5s infinite; }
  .pupil { animation: look 6s ease-in-out infinite; }
  .asleep .eye { animation: none; transform: scaleY(.12); }
  .asleep .pupil { animation: none; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes look { 0%, 30%, 100% { transform: translateX(0); } 40%, 55% { transform: translateX(-3.5px); } 65%, 80% { transform: translateX(1.5px); } }

  /* Startup steps */
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 7px 0; color: var(--faint); }
  li .dot { width: 20px; height: 20px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; }
  li.done { color: var(--fg); }
  li.done .dot { background: var(--accent); box-shadow: none; }
  li.done .dot::after { content: ""; width: 9px; height: 5px; border: solid var(--on-accent); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  li.now { color: var(--fg); font-weight: 600; }
  li.now .dot { box-shadow: inset 0 0 0 2px var(--line); border: 2px solid transparent; border-top-color: var(--accent); animation: spin .8s linear infinite; }
  li .note { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 13px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* When it's slow: what to try */
  .help { box-shadow: inset 0 0 0 1px var(--warn); background: var(--warn-bg); }
  .help strong { color: var(--warn); }
  .help button { margin-top: 14px; }
  .help .mono { color: var(--muted); margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* The cameras' pictures from last time */
  .snaps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  figure { margin: 0; }
  figure img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; display: block; background: var(--card); box-shadow: var(--ring); }
  figcaption { font-size: 12px; color: var(--muted); padding: 5px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  figcaption b { color: var(--fg); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { .eye, .pupil, li.now .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <svg class="mascot" id="mascot" viewBox="0 2 44 44" aria-hidden="true">
      <path fill-rule="evenodd" d="M8 39.5V21a14 14 0 0 1 28 0v18.5a1.5 1.5 0 0 1-1.5 1.5h-25A1.5 1.5 0 0 1 8 39.5zM17.5 41v-3.2a4.5 4.5 0 0 1 9 0V41z" fill="var(--accent)"/>
      <g class="eye"><circle cx="22" cy="20" r="8.2" fill="#fff"/><g class="pupil"><circle cx="23.3" cy="21.1" r="4.2" fill="#13241a"/><circle cx="24.9" cy="19.5" r="1.3" fill="#fff"/></g></g>
    </svg>
    <div>
      <h1 id="title">Wyze Tunnel</h1>
      <p id="msg" role="status" aria-live="polite">Checking…</p>
    </div>
  </header>

  <div class="card help" id="help" hidden>
    <strong id="help-title"></strong>
    <p id="help-text"></p>
    <div class="mono" id="help-log"></div>
    <button id="restart">Restart Wyze Tunnel</button>
  </div>
  <button id="start" hidden>Start Wyze Tunnel</button>

  <div class="card" id="steps" hidden>
    <ol>
      <li><span class="dot"></span>Starting up</li>
      <li><span class="dot"></span>Signing in to Wyze</li>
      <li><span class="dot"></span>Adding your cameras<span class="note" id="cams"></span></li>
      <li><span class="dot"></span>Opening Wyze Tunnel</li>
    </ol>
  </div>

  <div class="card" id="login" hidden>
    <dl>
      <dt>Username</dt><dd><code id="user">wbadmin</code></dd>
      <dt>Password</dt><dd><code id="pw"></code> <button id="copy" class="link">Copy</button></dd>
    </dl>
  </div>
  <button id="go" hidden>Set up Wyze Tunnel</button>
  <button id="open" hidden>Open Wyze Tunnel</button>
  <pre id="log" hidden></pre>

  <section id="last" hidden>
    <h2>Last seen</h2>
    <div class="snaps" id="snaps"></div>
  </section>
</main>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const $ = (id) => document.getElementById(id);
const say = (text) => ($("msg").textContent = text);
const STALL = 120; // seconds before the screen offers a restart
let since = Date.now(); // when this wait (or the last restart) began

function ago(s) {
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400 * 2) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} days ago`;
}

// Which startup step the bridge's log has reached: 0 starting, 1 signing in, 2 adding cameras.
function stepOf(log) {
  if (/\[\+\] Adding |Fetched \[\d+\] cameras|'cameras' from local cache/.test(log)) return 2;
  return log.trim() ? 1 : 0;
}

// Why it's slow and what to do, in plain words, from the end of the log.
const RESTART = "Restarting it fixes this most of the time. If it keeps happening, restart your computer.";
function stallHelp(log) {
  const tail = log.trim().split("\n").slice(-15).join("\n");
  if (!log.trim()) return ["Wyze Tunnel hasn't started yet.", RESTART];
  if (/unreachable|ConnectionError|timed out/i.test(tail)) return ["Wyze Tunnel can't reach the internet yet.", "Check that this computer is online. Wyze Tunnel keeps trying on its own."];
  if (/Traceback|Error|Exception/.test(tail)) return ["Wyze Tunnel ran into a problem while starting.", RESTART];
  return ["This is taking longer than usual.", RESTART];
}

let snapsShown = "";
async function showSnaps(snaps, names) {
  const key = snaps.map(([, n]) => n).join();
  $("last").hidden = !snaps.length;
  if (key === snapsShown) {
    snaps.forEach(([age], i) => { const t = $("snaps").children[i]?.querySelector("span"); if (t) t.textContent = ago(age); });
    return;
  }
  snapsShown = key;
  $("snaps").replaceChildren(...await Promise.all(snaps.map(async ([age, uri]) => {
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.alt = "";
    img.src = URL.createObjectURL(new Blob([await invoke("snapshot", { name: uri })], { type: "image/jpeg" }));
    const cap = document.createElement("figcaption");
    const name = document.createElement("b");
    name.textContent = names[uri] || uri.replace(/[-_]/g, " ").replace(/^./, (c) => c.toUpperCase());
    const when = document.createElement("span");
    when.textContent = ago(age);
    cap.append(name, " · ", when);
    fig.append(img, cap);
    return fig;
  })));
}

// Shows the startup steps from the bridge's log until its web UI answers, then the login and an Open button.
async function showWhenUp(openBrowser) {
  since = Date.now();
  $("title").textContent = "Waking up your cameras";
  $("go").hidden = $("log").hidden = true;
  say("This can take a minute after your computer starts.");
  for (;;) {
    const p = await invoke("progress");
    if (p.up) break;
    const asleep = p.stopped;
    $("mascot").classList.toggle("asleep", asleep);
    $("start").hidden = !asleep;
    $("steps").hidden = asleep;
    if (asleep) {
      $("title").textContent = "Wyze Tunnel is stopped";
      say("Your cameras aren't being watched or recorded until you start it again.");
      $("help").hidden = true;
    } else {
      $("title").textContent = "Waking up your cameras";
      const step = stepOf(p.log);
      [...$("steps").querySelectorAll("li")].forEach((li, i) => {
        li.className = i < step ? "done" : i === step ? "now" : "";
      });
      const cams = [...p.log.matchAll(/\[\+\] Adding (.+?) \[/g)].map((m) => m[1]);
      $("cams").textContent = cams.length ? `${cams.length} found` : "";
      const slow = (Date.now() - since) / 1000 > STALL;
      $("help").hidden = !slow;
      if (slow) {
        [$("help-title").textContent, $("help-text").textContent] = stallHelp(p.log);
        $("help-log").textContent = p.log.trim().split("\n").pop() || "";
        say("Still working on it.");
      }
    }
    const names = {};
    for (const m of p.log.matchAll(/\[\+\] Adding (.+?) \[/g)) names[m[1].toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")] = m[1];
    await showSnaps(p.snaps, names);
    await new Promise((r) => setTimeout(r, 2000));
  }
  $("mascot").classList.remove("asleep");
  $("steps").hidden = $("help").hidden = $("start").hidden = $("last").hidden = true;
  const pw = await invoke("password");
  $("pw").textContent = pw || "(the one you set)";
  if (!pw) $("user").textContent = "(the one you set)";
  $("title").textContent = "Wyze Tunnel is running";
  say("To sign in from a phone or a browser, use:");
  $("login").hidden = $("open").hidden = false;
  if (openBrowser) invoke("open_ui");
}

async function setup(full = false) {
  $("go").disabled = true;
  $("log").hidden = false;
  $("log").textContent = "";
  say("Setting up. The first time takes a few minutes, so keep this window open.");
  try {
    const code = await invoke("install", { full });
    if (code === 0) { $("log").hidden = true; return showWhenUp(true); }
    if (code === 3) return say("Windows needs to restart to finish turning on WSL. Restart your PC, then open Wyze Tunnel again.");
    if (code === 4) return say("Virtualization is turned off in your PC's BIOS. Restart, open the BIOS (usually Del or F2 while starting), turn on \"SVM Mode\" or \"Intel Virtualization Technology\", save, then open Wyze Tunnel again.");
    say(`Setup didn't finish (error ${code}). Check your internet connection and try again.`);
  } catch (e) {
    say(`Setup didn't finish: ${e}`);
  }
  $("go").textContent = "Try again";
  $("go").disabled = false;
}

listen("log", ({ payload }) => {
  const log = $("log");
  log.textContent += payload.replace(/\x1b\[[0-9;]*m/g, "") + "\n";
  log.scrollTop = log.scrollHeight;
});
$("go").onclick = () => setup();
// Tray item on Windows, shown while a camera needs the Wyze SDK: away from home (relay) or on old firmware.
listen("full-setup", () => {
  $("title").textContent = "Full camera support";
  say("This sets up a small Linux system (WSL) for cameras away from home and older cameras. Windows asks for permission and may need a restart.");
  $("login").hidden = $("open").hidden = true;
  $("go").textContent = "Set up";
  $("go").hidden = $("go").disabled = false;
  $("go").onclick = () => setup(true);
});
$("open").onclick = () => invoke("open_ui");
$("copy").onclick = () => navigator.clipboard.writeText($("pw").textContent).then(() => ($("copy").textContent = "Copied"));
$("start").onclick = $("restart").onclick = (e) => {
  e.target.disabled = true;
  since = Date.now();
  invoke("restart").finally(() => (e.target.disabled = false));
};

invoke("info").then((info) => {
  if (info.installed) return showWhenUp(false);
  $("title").textContent = "Welcome to Wyze Tunnel";
  say("Wyze Tunnel will download what it needs and set it up for you. You only do this once.");
  $("go").hidden = false;
});
</script>
</body>
</html>
