<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyze Tunnel</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #5d6676; --card: #fff; --accent: #3b6cf6; --log: #0f1420; --logfg: #cfd6e4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --fg: #e7ebf2; --muted: #99a3b4; --card: #1a202a; --log: #0a0d13; }
  }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 640px; margin: 10vh auto; padding: 0 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 28px; box-shadow: 0 1px 3px #0002; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { color: var(--muted); margin: 0 0 16px; }
  button { font: inherit; padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  pre { background: var(--log); color: var(--logfg); border-radius: 8px; padding: 12px; max-height: 40vh; overflow: auto; font-size: 12px; white-space: pre-wrap; margin: 16px 0 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 20px; }
  dt { color: var(--muted); } dd { margin: 0; }
  code { font-size: 15px; user-select: all; }
  button.link { background: none; color: var(--accent); padding: 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Wyze Tunnel</h1>
    <p id="msg" role="status" aria-live="polite">Checking…</p>
    <dl id="login" hidden>
      <dt>Username</dt><dd><code id="user">wbadmin</code></dd>
      <dt>Password</dt><dd><code id="pw"></code> <button id="copy" class="link">Copy</button></dd>
    </dl>
    <button id="go" hidden>Set up Wyze Tunnel</button>
    <button id="open" hidden>Open Wyze Tunnel</button>
    <pre id="log" hidden></pre>
  </div>
</main>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const $ = (id) => document.getElementById(id);
const say = (text) => ($("msg").textContent = text);
let url;

// Waits for the bridge's web UI to answer, then shows the login and an Open button.
async function showWhenUp(openBrowser) {
  $("title").textContent = "Wyze Tunnel";
  $("go").hidden = true;
  say("Starting Wyze Tunnel… this can take a minute after your computer starts.");
  for (;;) {
    try { await fetch(url, { mode: "no-cors" }); break; } catch {}
    await new Promise((r) => setTimeout(r, 2000));
  }
  const pw = await invoke("password");
  $("pw").textContent = pw || "(the one you set)";
  if (!pw) $("user").textContent = "(the one you set)";
  say("Wyze Tunnel is running. It opens in your browser; log in with:");
  $("login").hidden = $("open").hidden = false;
  if (openBrowser) invoke("open_ui");
}

async function setup() {
  $("go").disabled = true;
  $("log").hidden = false;
  $("log").textContent = "";
  say("Setting up. The first time takes a few minutes, so keep this window open.");
  try {
    const code = await invoke("install");
    if (code === 0) { $("log").hidden = true; return showWhenUp(true); }
    if (code === 3) return say("Windows needs to restart to finish turning on WSL. Restart your PC, then open Wyze Tunnel again.");
    say(`Setup didn't finish (error ${code}). Check your internet connection and try again.`);
  } catch (e) {
    say(`Setup didn't finish: ${e}`);
  }
  $("go").textContent = "Try again";
  $("go").disabled = false;
}

listen("log", ({ payload }) => {
  const log = $("log");
  log.textContent += payload.replace(/\x1b\[[0-9;]*m/g, "") + "\n";
  log.scrollTop = log.scrollHeight;
});
$("go").onclick = setup;
$("open").onclick = () => invoke("open_ui");
$("copy").onclick = () => navigator.clipboard.writeText($("pw").textContent).then(() => ($("copy").textContent = "Copied"));

invoke("info").then((info) => {
  url = info.url;
  if (info.installed) return showWhenUp(false);
  $("title").textContent = "Welcome to Wyze Tunnel";
  say("Wyze cameras need a small Linux system to run. Wyze Tunnel will download and set it up for you in the background. You only do this once.");
  $("go").hidden = false;
});
</script>
</body>
</html>
