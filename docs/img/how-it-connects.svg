<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Nunito, ui-rounded, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How apps connect to Wyze Tunnel</title>
  <desc id="d">Cameras feed Wyze Tunnel. Home Assistant, Claude and other apps call Wyze Tunnel with their own key. Wyze Tunnel sends signed webhooks out to apps.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15895a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7d8076"/></marker>
  </defs>
  <rect width="880" height="380" rx="28" fill="#f5f4f0"/>

  <g font-size="15" fill="#1a1c19">
    <rect x="30" y="120" width="150" height="140" rx="22" fill="#fff" stroke="#dedcd3"/>
    <text x="105" y="160" text-anchor="middle" font-weight="800" font-size="17">Wyze cameras</text>
    <text x="105" y="188" text-anchor="middle" fill="#5d6058">Doorbell</text>
    <text x="105" y="210" text-anchor="middle" fill="#5d6058">Cam v3, Pan</text>
    <text x="105" y="232" text-anchor="middle" fill="#5d6058">Floodlight</text>
  </g>
  <path d="M184 190H286" stroke="#7d8076" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="235" y="178" text-anchor="middle" font-size="13" fill="#7d8076">video</text>

  <rect x="292" y="100" width="210" height="180" rx="28" fill="#15895a"/>
  <path d="M367 210V176c0-19 13.5-34 30-34s30 15 30 34v34z" fill="#fff" opacity=".95"/>
  <ellipse cx="397" cy="182" rx="12" ry="13" fill="#15895a"/>
  <circle cx="399" cy="184" r="6" fill="#13241a"/>
  <text x="397" y="244" text-anchor="middle" font-weight="800" font-size="20" fill="#fff">Wyze Tunnel</text>
  <text x="397" y="266" text-anchor="middle" font-size="13" fill="#d6efe2">on your home network</text>

  <g font-size="15" fill="#1a1c19">
    <rect x="610" y="30" width="240" height="78" rx="20" fill="#fff" stroke="#dedcd3"/>
    <text x="632" y="64" font-weight="800" font-size="17">Home Assistant</text>
    <text x="632" y="88" fill="#5d6058">video, motion, controls</text>
    <rect x="610" y="151" width="240" height="78" rx="20" fill="#fff" stroke="#dedcd3"/>
    <text x="632" y="185" font-weight="800" font-size="17">Claude and AI apps</text>
    <text x="632" y="209" fill="#5d6058">"Is anyone at the door?"</text>
    <rect x="610" y="272" width="240" height="78" rx="20" fill="#fff" stroke="#dedcd3"/>
    <text x="632" y="306" font-weight="800" font-size="17">Other apps</text>
    <text x="632" y="330" fill="#5d6058">Node-RED, scripts, n8n</text>
  </g>

  <g stroke="#15895a" stroke-width="2.5" fill="none">
    <path d="M606 62C560 62 552 140 506 150" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M606 190H506" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M606 300C560 300 552 236 506 228" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g font-size="12.5" fill="#0e6b45" font-weight="700">
    <rect x="512" y="74" width="80" height="24" rx="12" fill="#dff0e7"/><text x="552" y="91" text-anchor="middle">own key</text>
    <rect x="512" y="200" width="80" height="24" rx="12" fill="#dff0e7"/><text x="552" y="217" text-anchor="middle">own key</text>
    <rect x="512" y="300" width="88" height="24" rx="12" fill="#dff0e7"/><text x="556" y="317" text-anchor="middle">+ webhooks</text>
  </g>
  <text x="397" y="330" text-anchor="middle" font-size="13" fill="#5d6058">Take any key back on the Connect apps page.</text>
  <text x="397" y="350" text-anchor="middle" font-size="13" fill="#5d6058">It stops working right away.</text>
</svg>
