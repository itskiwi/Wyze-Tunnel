name: Release

# Push a tag like v2.11.0 to publish a GitHub release with one ready-to-install bundle per CPU
# plus SHA256SUMS. Installers fetch releases/latest/download/wyze-tunnel-linux-$(uname -m).tar.gz.
# Or run it from the Actions tab: with a version it tags the commit and publishes the same way;
# without one it only builds the bundles as a workflow artifact.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and publish, like 2.11.0 (leave empty to only build)'
        required: false

permissions:
  contents: write
  actions: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version && format('v{0}', inputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build bundles
        run: |
          if [ -n "$TAG" ]; then
            [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $TAG" >&2; exit 1; }
            export VERSION=${TAG#v}
          fi
          for cpu in x86_64 aarch64 armv7l; do native/build-bundle.sh "$cpu" dist; done
          cd dist && sha256sum *.tar.gz | tee SHA256SUMS

      - name: Check the x86_64 bundle runs
        run: |
          mkdir check && tar xzf dist/wyze-tunnel-linux-x86_64.tar.gz -C check --strip-components=1
          check/bin/ffmpeg -hide_banner -version | head -1
          check/mediamtx --help >/dev/null
          test "$(ls check/app/lib)" = lib.amd64

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/

      - name: Publish release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on this commit when it doesn't exist yet (the Actions-tab route).
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes
          # Tags made with this token don't fire other workflows, so start the Docker/Home Assistant build here.
          gh workflow run docker-image.yml --ref "$TAG"
