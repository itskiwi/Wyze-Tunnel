name: Release

# Push a tag like v2.11.0 to publish a GitHub release with one ready-to-install bundle per CPU
# plus SHA256SUMS, and Tunnel Box disk images (box/build-image.sh). Installers fetch
# releases/latest/download/wyze-tunnel-linux-$(uname -m).tar.gz.
# Or run it from the Actions tab: with a version it tags the commit and publishes the same way;
# without one it only builds the bundles as a workflow artifact.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and publish, like 2.11.0 (leave empty to only build)'
        required: false

permissions:
  contents: write
  actions: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version && format('v{0}', inputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build bundles
        run: |
          if [ -n "$TAG" ]; then
            [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $TAG" >&2; exit 1; }
            export VERSION=${TAG#v}
          fi
          for cpu in x86_64 aarch64 armv7l; do native/build-bundle.sh "$cpu" dist; done
          native/build-windows-bundle.sh dist  # the Windows desktop app runs this natively
          cd dist && sha256sum *.tar.gz *.zip | tee SHA256SUMS

      - name: Check the x86_64 bundle runs
        run: |
          mkdir check && tar xzf dist/wyze-tunnel-linux-x86_64.tar.gz -C check --strip-components=1
          check/bin/ffmpeg -hide_banner -version | head -1
          check/mediamtx --help >/dev/null
          check/go2rtc -version
          test "$(ls check/app/lib)" = lib.amd64

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/

      - name: Publish release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on this commit when it doesn't exist yet (the Actions-tab route).
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes
          # Tags made with this token don't fire other workflows, so start the Docker/Home Assistant build here.
          gh workflow run docker-image.yml --ref "$TAG"

  # Tunnel Box: flash-and-plug-in disk images, built on a machine with the image's CPU.
  images:
    needs: bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: pi, cpu: aarch64, runner: ubuntu-24.04-arm }
          - { board: pc, cpu: x86_64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version && format('v{0}', inputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist
      - name: Build the ${{ matrix.board }} image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cloud-guest-utils
          sudo box/build-image.sh ${{ matrix.board }} dist/wyze-tunnel-linux-${{ matrix.cpu }}.tar.gz images
          cd images && sha256sum *.img.xz | tee wyze-tunnel-box-${{ matrix.board }}.img.xz.sha256

      - name: Boot the PC image and open the web page
        if: matrix.board == 'pc'
        run: |
          sudo apt-get install -y -qq qemu-system-x86
          xz -dc images/wyze-tunnel-box-pc.img.xz > box.img
          sudo qemu-system-x86_64 -m 2048 -smp 2 $([ -e /dev/kvm ] && echo -enable-kvm) -display none \
            -drive file=box.img,format=raw -nic user,hostfwd=tcp::8080-:80 -serial file:console.log &
          timeout 600 sh -c 'until curl -fsS -o /dev/null http://127.0.0.1:8080/login; do sleep 5; done' ||
            { tail -50 console.log; exit 1; }
          echo "Web page answers on port 80"; grep -a -A3 "Wyze Tunnel is ready" console.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.board }}
          path: images/
          compression-level: 0

      - name: Add to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" images/*
