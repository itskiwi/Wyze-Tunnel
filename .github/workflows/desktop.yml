name: Desktop apps

# Builds the Windows and Mac tray apps in desktop/. Push a tag like desktop-v0.1.0, or run it from the
# Actions tab with that version (matching desktop/src-tauri/tauri.conf.json), to publish them as a release.
# Desktop releases are never marked "latest": installers download bridge bundles from releases/latest.
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', 'windows/**', 'mac/install.sh', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'windows/**', 'mac/install.sh', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and publish, like 0.1.0 (leave empty to only build)'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            out: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: ''
            out: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      # Signs the app and its installer with Microsoft's Artifact Signing (formerly Trusted Signing), so Windows
      # doesn't show "Windows protected your PC". Skipped until the six secrets are set (see docs/windows-signing.md).
      - name: Set up Windows code signing
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: bash
        env:
          ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --version 0.11.0 --locked
          printf '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e %s -a %s -c %s %%1"}}}' \
            "$ENDPOINT" "$ACCOUNT" "$PROFILE" > signing.json
          echo "SIGN_ARGS=--config signing.json" >> "$GITHUB_ENV"
      - run: npx tauri build ${{ matrix.args }} ${{ env.SIGN_ARGS }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - name: Check the installer is signed
        if: env.SIGN_ARGS != ''
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature (Get-Item src-tauri/target/release/bundle/nsis/*.exe)
          $s | Format-List Status, SignerCertificate
          if ($s.Status -ne 'Valid') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.out }}
      # The Microsoft Store package (docs/microsoft-store.md). Kept out of releases: the Store signs and ships it.
      - name: Build the Store package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STORE_NAME: ${{ vars.STORE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ../windows/msix/build.ps1 -Version $v -Out "$PWD/wyze-tunnel-$v-test.msix"
          if ($env:STORE_NAME) {
            ../windows/msix/build.ps1 -Version $v -Out "$PWD/wyze-tunnel-$v-store.msix" -Name $env:STORE_NAME -Publisher $env:STORE_PUBLISHER -PublisherName $env:STORE_PUBLISHER_NAME
          }
      - name: Check the Store package installs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The same Developer Mode route as docs/microsoft-store.md: Windows won't install an unsigned full-trust .msix itself.
          Copy-Item (Get-Item wyze-tunnel-*-test.msix) test.zip
          Expand-Archive test.zip test
          Add-AppxPackage -Register test/AppxManifest.xml
          $p = Get-AppxPackage WyzeTunnel.Test
          $p | Format-List Name, Version, InstallLocation, SignatureKind
          if (-not (Test-Path "$($p.InstallLocation)/windows/install-native.ps1")) { throw 'install-native.ps1 is missing' }
          Remove-AppxPackage $p.PackageFullName
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: store-msix
          path: desktop/*.msix

  release:
    # Publish even when the Mac build couldn't get a runner; Windows is the platform that must ship.
    if: ${{ !cancelled() && (github.ref_type == 'tag' || inputs.version) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - run: ls dist/*.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}
        # --target creates the tag on this commit when it doesn't exist yet (the Actions-tab route).
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wyze Tunnel desktop ${TAG#desktop-v}" --latest=false --generate-notes
