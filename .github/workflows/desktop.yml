name: Desktop apps

# Builds the Windows and Mac tray apps in desktop/. Push a tag like desktop-v0.1.0
# (matching the version in desktop/src-tauri/tauri.conf.json) to publish them as a release.
# Desktop releases are never marked "latest": installers download bridge bundles from releases/latest.
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', 'windows/**', 'mac/install.sh', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'windows/**', 'mac/install.sh', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            out: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: ''
            out: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.out }}

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Wyze Tunnel desktop ${GITHUB_REF_NAME#desktop-v}" --latest=false --generate-notes
