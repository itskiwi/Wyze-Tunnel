name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest==8.* ruff==0.15.*
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 app tests
      - name: Lint shell scripts
        run: shellcheck -S error native/*.sh mac/*.sh
      - run: pytest -q tests

  install:
    name: install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', runner: ubuntu-latest }
          - { name: Debian 12, image: 'debian:12', runner: ubuntu-latest }
          # Raspberry Pi OS has no official container image; it's Debian 13 on arm64.
          - { name: Raspberry Pi OS base (Debian 13 arm64), image: 'debian:13', runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Boot ${{ matrix.image }} with systemd
        run: |
          docker run -d --name os --privileged --cgroupns=host -e container=docker \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock -v "$PWD:/src:ro" \
            ${{ matrix.image }} sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd systemd-sysv >/dev/null && exec /sbin/init'
          timeout 300 sh -c 'until docker exec os systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; do sleep 3; done'
      - name: Install
        run: docker exec os /src/native/install.sh
      - name: Web UI answers
        run: timeout 120 sh -c 'until docker exec os curl -fsS -o /dev/null http://127.0.0.1:5000/login; do sleep 3; done'
      - name: Auto-update is set up
        run: |
          docker exec os systemctl is-enabled wyze-tunnel-update.timer wyze-tunnel-update.path
          docker exec os /opt/wyze-tunnel/install.sh --update
      - name: Update button triggers the updater
        run: |
          docker exec os sh -c 'touch /var/lib/private/wyze-tunnel/update-now'
          timeout 60 sh -c 'until docker exec os sh -c "! test -e /var/lib/private/wyze-tunnel/update-now"; do sleep 2; done'
          docker exec os journalctl -u wyze-tunnel-update --no-pager -n 5
      - name: Re-run install (update)
        run: docker exec os /src/native/install.sh
      - name: Web UI answers after update
        run: timeout 120 sh -c 'until docker exec os curl -fsS -o /dev/null http://127.0.0.1:5000/login; do sleep 3; done'
      - name: Service logs
        if: always()
        run: docker exec os journalctl -u wyze-tunnel --no-pager -n 100 || docker logs os
