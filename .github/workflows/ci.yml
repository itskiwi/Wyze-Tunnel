name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest==8.* ruff==0.15.*
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 app tests
      - name: Lint shell scripts
        run: shellcheck -S error native/*.sh mac/*.sh box/*.sh box/wyze-tunnel-box .github/check-leaks.sh
      - name: No personal data, secrets or stray images in the repo
        run: .github/check-leaks.sh
      - run: pytest -q tests

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest-homeassistant-custom-component==0.13.316 PyTurboJPEG
      - run: pytest -q -c tests_ha/pytest.ini tests_ha

  install:
    name: install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', runner: ubuntu-latest }
          - { name: Debian 12, image: 'debian:12', runner: ubuntu-latest }
          # Raspberry Pi OS has no official container image; it's Debian 13 on arm64.
          - { name: Raspberry Pi OS base (Debian 13 arm64), image: 'debian:13', runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Boot ${{ matrix.image }} with systemd
        run: |
          docker run -d --name os --privileged --cgroupns=host -e container=docker \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock -v "$PWD:/src:ro" \
            ${{ matrix.image }} sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd systemd-sysv >/dev/null && exec /sbin/init'
          timeout 300 sh -c 'until docker exec os systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; do sleep 3; done'
      - name: Install
        run: docker exec os /src/native/install.sh
      - name: Web UI answers
        run: timeout 120 sh -c 'until docker exec os curl -fsS -o /dev/null http://127.0.0.1:5000/login; do sleep 3; done'
      - name: Stops quickly
        run: |
          start=$(date +%s)
          docker exec os systemctl restart wyze-tunnel
          took=$(( $(date +%s) - start ))
          echo "restart took ${took}s"
          [ "$took" -lt 20 ]
          timeout 120 sh -c 'until docker exec os curl -fsS -o /dev/null http://127.0.0.1:5000/login; do sleep 3; done'
      - name: Auto-update is set up
        run: |
          docker exec os systemctl is-enabled wyze-tunnel-update.timer wyze-tunnel-update.path
          docker exec os /opt/wyze-tunnel/install.sh --update
          docker exec os wyze-tunnel status
      - name: Update button triggers the updater
        run: |
          docker exec os sh -c 'touch /var/lib/private/wyze-tunnel/update-now'
          timeout 60 sh -c 'until docker exec os sh -c "! test -e /var/lib/private/wyze-tunnel/update-now"; do sleep 2; done'
          # A oneshot unit is "activating" while it runs.
          timeout 300 sh -c 'while [ "$(docker exec os systemctl show -p ActiveState --value wyze-tunnel-update)" = activating ]; do sleep 2; done'
          docker exec os journalctl -u wyze-tunnel-update --no-pager -n 5
      - name: Update installs a newer release
        run: |
          docker exec os sed -i 's/^VERSION=.*/VERSION=0.0.1/' /opt/wyze-tunnel/app/.env
          docker exec os /opt/wyze-tunnel/install.sh --update | tee /tmp/update.log
          grep -q '^Updated to v' /tmp/update.log
          docker exec os sh -c '! test -e /opt/wyze-tunnel.previous'
      - name: A release that doesn't start is undone
        run: |
          docker exec os cp /src/native/install.sh /opt/wyze-tunnel/install.sh
          docker exec os sed -i 's/^VERSION=.*/VERSION=0.0.1/' /opt/wyze-tunnel/app/.env
          # Hold the web port so the new version can't start.
          docker exec os systemctl stop wyze-tunnel
          docker exec -d os python3 -c "import os, socket, time; open('/tmp/hold.pid', 'w').write(str(os.getpid())); s = socket.socket(); s.bind(('0.0.0.0', 5000)); s.listen(); time.sleep(600)"
          sleep 2
          if docker exec os /opt/wyze-tunnel/install.sh --update; then exit 1; fi
          docker exec os grep -q '^VERSION=0.0.1' /opt/wyze-tunnel/app/.env
          docker exec os test -s /opt/wyze-tunnel/.failed-version
          # A release published while CI runs would be "new" again; mark whatever is latest now as the failed one.
          docker exec os sh -c 'v=$(curl -fsSL -o /dev/null -w "%{url_effective}" https://github.com/itskiwi/Wyze-Tunnel/releases/latest); echo "${v##*/tag/v}" > /opt/wyze-tunnel/.failed-version'
          docker exec os /opt/wyze-tunnel/install.sh --update > /tmp/skip.log
          grep -q "didn't start here last time" /tmp/skip.log
          docker exec os sh -c 'kill $(cat /tmp/hold.pid)'
      - name: Re-run install (update)
        run: docker exec os /src/native/install.sh
      - name: Web UI answers after update
        run: timeout 120 sh -c 'until docker exec os curl -fsS -o /dev/null http://127.0.0.1:5000/login; do sleep 3; done'
      - name: Service logs
        if: always()
        run: docker exec os journalctl -u wyze-tunnel --no-pager -n 100 || docker logs os

  windows-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: native/build-windows-bundle.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/

  windows:
    name: install (Windows, native)
    needs: windows-bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1, like users have: installs the latest published bundle.
      - name: install-native.ps1
        shell: powershell
        run: |
          windows\install-native.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:LOCALAPPDATA\Wyze Tunnel\native\wyze-tunnel\python\python.exe")) { exit 1 }
          Get-NetFirewallRule -DisplayName 'Wyze Tunnel (go2rtc.exe)', 'Wyze Tunnel (mediamtx.exe)', 'Wyze Tunnel (python.exe)' | Format-Table DisplayName, Action, Profile
          # The web page and video server take home networks and Tailscale only, never any address.
          foreach ($name in 'python.exe', 'mediamtx.exe') {
            $from = (Get-NetFirewallRule -DisplayName "Wyze Tunnel ($name)" | Get-NetFirewallAddressFilter).RemoteAddress
            Write-Output "$name accepts: $($from -join ', ')"
            if ($from -contains 'Any' -or -not ($from -match '^100\.64\.0\.0/')) { exit 1 }
          }
          windows\install-native.ps1 -CheckFirewall
          if ($LASTEXITCODE) { Write-Output 'The firewall check still wants a fix'; exit 1 }
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
      # Starts the bridge the way the desktop app does (desktop/src-tauri/src/main.rs, start_native).
      - name: Start the bridge, web UI answers
        shell: pwsh
        run: |
          Expand-Archive wyze-tunnel-windows-x86_64.zip bundle  # not native\: the checkout has one
          $n = "$PWD\bundle\wyze-tunnel"; $d = "$PWD\data"
          'tokens', 'img', 'record', 'logs' | ForEach-Object { New-Item -ItemType Directory -Force "$d\$_" | Out-Null }
          Copy-Item "$n\mediamtx.yml" $d
          $env:FLASK_APP = 'frontend'; $env:PYTHONUNBUFFERED = '1'; $env:PYTHONUTF8 = '1'; $env:PATH = "$n\bin;$env:PATH"
          $env:TOKEN_PATH = "$d\tokens\"; $env:IMG_DIR = "$d\img\"; $env:RECORD_PATH = "$d\record\%path\%Y-%m-%d_%H-%M-%S-%f"; $env:LOG_PATH = "$d\logs"
          $env:MEDIAMTX_BIN = "$n\mediamtx.exe"; $env:MEDIAMTX_CONFIG = "$d\mediamtx.yml"
          $env:GO2RTC_BIN = "$n\go2rtc.exe"; $env:GO2RTC_CONFIG = "$d\go2rtc.yaml"
          $env:TUTK_LIB = "$n\no-wyze-sdk"; $env:WB_AUTH = 'True'; $env:WB_PASSWORD = 'ci-only-password'
          Start-Process "$n\python\python.exe" -ArgumentList '-m', 'flask', 'run', '--host=0.0.0.0' -WorkingDirectory "$n\app" `
            -RedirectStandardOutput bridge.log -RedirectStandardError bridge.err.log
          # Same step: the Windows runner ends a step's child processes when the step finishes.
          for ($i = 0; $i -lt 40; $i++) {
            curl.exe -fsS -o NUL --max-time 10 http://127.0.0.1:5000/login
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 3
          }
          exit 1
      # Footage search on Windows: OpenCV loads, the model downloads, ffmpeg's raw frames pipe through, a hit is saved.
      - name: Detection works in the Windows bundle
        shell: pwsh
        run: |
          $n = "$PWD\bundle\wyze-tunnel"; $d = "$PWD\detect-data"
          New-Item -ItemType Directory -Force $d | Out-Null; 'paths: {}' | Set-Content "$d\mediamtx.yml"
          $env:PATH = "$n\bin;$env:PATH"; $env:TOKEN_PATH = "$d\"; $env:IMG_DIR = "$d\img\"; $env:MEDIAMTX_CONFIG = "$d\mediamtx.yml"
          @'
          import subprocess
          import numpy as np
          from wyzebridge import detect
          model = detect.load_model()
          assert model, "the detection model didn't load"
          watcher = detect.Watcher("ci", "CI")
          cmd = watcher.ffmpeg_cmd()
          cmd = cmd[:cmd.index("-i")] + ["-f", "lavfi", "-i", "testsrc=size=1280x720:rate=5", "-t", "1"] + cmd[cmd.index("-map"):]
          cmd.remove("-rtsp_transport"); cmd.remove("tcp")
          raw = subprocess.run(cmd, capture_output=True, check=True).stdout
          frame = np.frombuffer(raw[: detect.WIDTH * detect.HEIGHT * 3], np.uint8).reshape(detect.HEIGHT, detect.WIDTH, 3)
          print("found", detect.find_objects(model, frame))
          strong = detect.load_model("strong")
          assert isinstance(strong, detect.Yolox), "the stronger model didn't load"
          from wyzebridge import ai
          assert ai.GPU in ai.ort.get_available_providers(), "the bundle lacks ONNX Runtime's DirectML build"
          assert isinstance(strong.net, ai.Model), "the stronger model didn't load in ONNX Runtime"
          print("stronger model runs on the", strong.net.device)
          print("found (stronger)", detect.find_objects(strong, frame))
          class Fake:
              def detect(self, frame, score):
                  return [15], [0.9], [[0, 0, 1, 1]]
          watcher.check(Fake(), frame)
          assert (detect.THUMB_DIR / "1.jpg").exists() and detect.search()[0]["label"] == "person"
          print("detection ok")
          '@ | & "$n\python\python.exe" -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Saved sign-ins are sealed with the real DPAPI, and plain ones from older versions still open and get sealed.
      - name: Secrets are encrypted on Windows
        shell: pwsh
        run: |
          $n = "$PWD\bundle\wyze-tunnel"; $d = "$PWD\vault-data"
          New-Item -ItemType Directory -Force $d | Out-Null; 'paths: {}' | Set-Content "$d\mediamtx.yml"
          $env:TOKEN_PATH = "$d\"; $env:IMG_DIR = "$d\img\"; $env:MEDIAMTX_CONFIG = "$d\mediamtx.yml"
          @'
          import os
          from pathlib import Path
          from wyzebridge import lockdown, vault
          tokens = Path(os.environ["TOKEN_PATH"])
          assert vault.enabled()
          vault.write_text(tokens / "wb_api", "ci-secret")
          assert vault.sealed(tokens / "wb_api") and b"ci-secret" not in (tokens / "wb_api").read_bytes()
          assert vault.read_text(tokens / "wb_api") == "ci-secret"
          (tokens / "auth.pickle").write_bytes(b"old plain cache")
          lockdown.seal_secrets()
          assert vault.sealed(tokens / "auth.pickle") and vault.read_bytes(tokens / "auth.pickle") == b"old plain cache"
          print("vault ok")
          '@ | & "$n\python\python.exe" -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bridge logs
        if: always()
        shell: pwsh
        run: Get-Content bridge.log, bridge.err.log -ErrorAction SilentlyContinue
