{% extends 'base.html' %}

{% block title %}Devices · {% endblock %}
{% block content %}
<header class="mb-6 flex flex-wrap items-center gap-3 pt-2">
    <h1 class="page-title">Devices</h1>
    <button id="refresh" class="btn ml-auto"><i class="fas fa-rotate"></i>Refresh</button>
</header>

<div class="mx-auto max-w-2xl">
    <p class="text-sm text-zinc-400">Plugs, lights, locks, sensors and the thermostat on your Wyze account. States come from the Wyze cloud and can be a minute old.</p>
    <p id="status" class="mt-3 text-sm text-zinc-400" role="status">Loading…</p>
    <div id="groups" class="mt-4 space-y-6"></div>
    <div id="automations" class="mt-6 space-y-6"></div>
</div>
{% endblock %}

{% block javascript %}
<script>
    const GROUPS = { OutdoorPlug: "Plugs", Plug: "Plugs", MeshLight: "Lights", Lock: "Locks", Thermostat: "Thermostat", Common: "Room sensors",
        ContactSensor: "Door and window sensors", MotionSensor: "Motion sensors", ChimeSensor: "Chimes" };
    const status = document.getElementById("status");
    const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls || "", textContent: text ?? "" });

    function send(dev, body) {
        status.className = "mt-3 text-sm text-zinc-400";
        status.textContent = `Sending to ${dev.name}…`;
        return fetch("api/devices", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mac: dev.mac, ...body }) })
            .then((r) => r.json().then((data) => r.ok ? data : Promise.reject(new Error(data.error))))
            .then(() => { status.textContent = `Sent to ${dev.name}.`; setTimeout(() => load(true), 3000); })
            .catch((err) => { status.className = "mt-3 text-sm text-rose-300"; status.textContent = err.message || "Couldn't send. Try again."; });
    }

    function button(label, onClick, primary) {
        const b = el("button", primary ? "btn btn-primary" : "btn", label);
        b.addEventListener("click", onClick);
        return b;
    }

    function facts(s) {
        const out = [];
        if (s.on !== undefined) out.push(s.on ? "On" : "Off");
        if (s.locked !== undefined) out.push(s.locked ? "Locked" : "Unlocked");
        if (s.open !== undefined) out.push(s.open ? "Open" : "Closed");
        if (s.motion !== undefined) out.push(s.motion ? "Motion" : "No motion");
        if (s.temperature !== undefined) out.push(`${s.temperature}°${s.temp_unit || ""}`);
        if (s.humidity !== undefined) out.push(`${s.humidity}% humidity`);
        if (s.mode_sys) out.push(`Mode ${s.mode_sys}${s.working_state ? `, ${s.working_state}` : ""}`);
        if (s.heat_sp) out.push(`Heat to ${s.heat_sp}, cool to ${s.cool_sp}`);
        if (s.brightness) out.push(`${s.brightness}% bright`);
        if (s.battery !== undefined && s.battery !== null) out.push(`Battery ${s.battery}${s.locked !== undefined ? "%" : ""}`);
        if (s.low_battery) out.push("Low battery");
        return out.join(" · ");
    }

    function controls(dev) {
        const s = dev.state, box = el("div", "mt-3 flex flex-wrap items-center gap-2");
        if (dev.type === "OutdoorPlug" || dev.type === "Plug") {
            box.append(button(s.on ? "Turn off" : "Turn on", () => send(dev, { on: !s.on }), !s.on));
        } else if (dev.type === "MeshLight") {
            box.append(button(s.on ? "Turn off" : "Turn on", () => send(dev, { on: !s.on }), !s.on));
            const bright = Object.assign(el("input", "w-32"), { type: "range", min: 1, max: 100, value: s.brightness || 100 });
            bright.setAttribute("aria-label", "Brightness");
            bright.addEventListener("change", () => send(dev, { brightness: Number(bright.value) }));
            const warm = Object.assign(el("input", "w-32"), { type: "range", min: 1800, max: 6500, step: 100, value: s.color_temp || 2700 });
            warm.setAttribute("aria-label", "Color temperature");
            warm.addEventListener("change", () => send(dev, { color_temp: Number(warm.value) }));
            const color = Object.assign(el("input", "h-9 w-12"), { type: "color", value: `#${s.color || "FFFFFF"}` });
            color.setAttribute("aria-label", "Color");
            color.addEventListener("change", () => send(dev, { color: color.value }));
            box.append(bright, warm, color);
        } else if (dev.type === "Thermostat") {
            const mode = el("select", "field w-28");
            mode.setAttribute("aria-label", "Mode");
            mode.append(...["auto", "heat", "cool", "off"].map((m) => new Option(m, m, false, m === s.mode_sys)));
            const heat = Object.assign(el("input", "field w-20"), { type: "number", value: s.heat_sp || "" });
            heat.setAttribute("aria-label", "Heat to");
            const cool = Object.assign(el("input", "field w-20"), { type: "number", value: s.cool_sp || "" });
            cool.setAttribute("aria-label", "Cool to");
            box.append(mode, el("span", "text-sm text-zinc-400", "Heat"), heat, el("span", "text-sm text-zinc-400", "Cool"), cool,
                button("Save", () => send(dev, { mode: mode.value, heat_sp: Number(heat.value), cool_sp: Number(cool.value) }), true));
        } else if (dev.type === "Lock") {
            box.append(button("Lock", () => send(dev, { lock: true }), true),
                button("Unlock", () => confirm(`Unlock ${dev.name}?`) && send(dev, { lock: false })));
        }
        return box.childElementCount ? box : "";
    }

    function render(list) {
        const groups = {};
        list.forEach((d) => (groups[GROUPS[d.type] || "Hubs and other devices"] ??= []).push(d));
        document.getElementById("groups").replaceChildren(...Object.entries(groups).map(([name, devs]) => {
            const section = el("section", "surface p-5");
            section.append(el("h2", "font-semibold", name));
            devs.forEach((dev) => {
                const row = el("div", "mt-4 border-t border-zinc-800 pt-4 first-of-type:border-0");
                const head = el("div", "flex flex-wrap items-center gap-2");
                head.append(el("span", "font-medium", dev.name), el("span", "text-xs text-zinc-500", dev.model),
                    el("span", `chip ${dev.online ? "chip-ok" : "chip-bad"} ml-auto`, dev.online ? "Online" : "Offline"));
                row.append(head, el("p", "mt-1 text-sm text-zinc-400", dev.state.error || facts(dev.state)), controls(dev));
                section.append(row);
            });
            return section;
        }));
    }

    function load(fresh) {
        return fetch(`api/devices${fresh ? "?fresh=1" : ""}`)
            .then((r) => r.json().then((data) => r.ok ? data : Promise.reject(new Error(data.error))))
            .then((data) => {
                render(data.devices);
                if (!document.getElementById("automations").childElementCount) loadAutomations(data.devices);
                if (!status.classList.contains("text-rose-300")) status.textContent = data.devices.length ? "" : "No plugs, lights, locks or sensors on this Wyze account.";
            })
            .catch((err) => { status.className = "mt-3 text-sm text-rose-300"; status.textContent = err.message || "Couldn't load devices."; });
    }
    // Automations: each panel saves its own settings. Only the owner's save goes through.
    const autos = { settings: {}, cameras: [] };
    const ofType = (...types) => (list) => list.filter((d) => types.includes(d.type)).map((d) => ({ mac: d.mac, name: d.name }));
    const PANELS = [
        { key: "heat", title: "Pause the heat when a door is open",
            blurb: "When a chosen door or window has been open for a while, the thermostat goes off. When they are all closed again it goes back to the mode it had. If you change the thermostat yourself in between, it's left alone.",
            fields: [{ name: "sensors", kind: "pick", label: "Doors and windows", options: ofType("ContactSensor") },
                { name: "minutes", kind: "number", label: "Open for (minutes)", fallback: 2 }] },
        { key: "lights", title: "Lights follow people at night",
            blurb: "When a chosen camera sees a person between sunset and sunrise, the chosen plugs and lights come on for a while, then go off. Anything that was already on is left on. Uses Wyze's own person detection (Cam Plus), so keep Event Recording on.",
            fields: [{ name: "cameras", kind: "pick", label: "Cameras", options: () => autos.cameras },
                { name: "devices", kind: "pick", label: "Plugs and lights", options: ofType("Plug", "OutdoorPlug", "MeshLight") },
                { name: "also_motion", kind: "check", label: "Also react to plain motion (for cameras without person detection)" },
                { name: "minutes", kind: "number", label: "Stay on for (minutes)", fallback: 5 }] },
    ];

    // Returns the row and a function that reads its value back.
    function field(f, value, list) {
        const wrap = el("div", "mt-3 text-sm");
        if (f.kind === "check") {
            const box = Object.assign(el("input", "h-4 w-4 accent-accent"), { type: "checkbox", checked: value === true });
            const label = el("label", "flex items-center gap-2");
            label.append(box, el("span", "", f.label));
            wrap.append(label);
            return [wrap, () => box.checked];
        }
        wrap.append(el("span", "block text-zinc-400", f.label));
        if (f.kind === "pick") {
            const boxes = f.options(list).map((o) => {
                const box = Object.assign(el("input", "h-4 w-4 accent-accent"), { type: "checkbox", checked: (value || []).includes(o.mac) });
                const label = el("label", "mt-1 flex items-center gap-2");
                label.append(box, el("span", "", o.name));
                wrap.append(label);
                return [o.mac, box];
            });
            if (!boxes.length) wrap.append(el("span", "text-zinc-500", "None found."));
            return [wrap, () => boxes.filter(([, b]) => b.checked).map(([mac]) => mac)];
        }
        const input = Object.assign(el("input", "field mt-1 w-32"), { type: f.kind === "time" ? "time" : "number", value: value ?? f.fallback ?? "", min: 1, max: 60 });
        input.setAttribute("aria-label", f.label);
        wrap.append(input);
        return [wrap, () => (f.kind === "time" || input.value === "" ? input.value : Number(input.value))];
    }

    function renderAutomations(list) {
        document.getElementById("automations").replaceChildren(...PANELS.map((p) => {
            const cfg = autos.settings[p.key] || {};
            const section = el("section", "surface p-5");
            section.append(el("h2", "font-semibold", p.title), el("p", "mt-1 text-sm text-zinc-400", p.blurb));
            const getters = [];
            [{ name: "on", kind: "check", label: "Turn this on" }, ...p.fields].forEach((f) => {
                const [wrap, get] = field(f, cfg[f.name], list);
                section.append(wrap);
                getters.push([f.name, get]);
            });
            const msg = el("p", "mt-3 text-sm");
            msg.setAttribute("role", "status");
            const save = button("Save", () => {
                fetch("api/automations", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ [p.key]: Object.fromEntries(getters.map(([name, get]) => [name, get()])) }) })
                    .then((r) => r.json().then((data) => r.ok ? data : Promise.reject(new Error(data.error))))
                    .then((data) => { autos.settings = data.settings; msg.className = "mt-3 text-sm text-emerald-300"; msg.textContent = "Saved."; })
                    .catch((err) => { msg.className = "mt-3 text-sm text-rose-300"; msg.textContent = err.message || "Couldn't save."; });
            }, true);
            const row = el("div", "mt-4");
            row.append(save);
            section.append(row, msg);
            return section;
        }));
    }

    function loadAutomations(list) {
        fetch("api/automations").then((r) => r.json()).then((data) => {
            autos.settings = data.settings || {};
            autos.cameras = data.cameras || [];
            renderAutomations(list);
        });
    }
    document.getElementById("refresh").addEventListener("click", () => load(true));
    load(false);
</script>
{% endblock %}
