{% extends 'base.html' %}

{% block content %}
<header class="mb-6 flex flex-wrap items-center gap-3">
    <a href="./" class="mr-2 flex items-center gap-2 text-lg font-semibold tracking-tight">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-emerald-500 text-zinc-950"><i
                class="fas fa-video text-sm"></i></span>
        Wyze Tunnel
    </a>
    <h1 class="text-lg text-zinc-400">Cameras</h1>
</header>

<div class="mx-auto max-w-xl">
    <p class="text-sm text-zinc-400">Unchecked cameras are hidden and don't stream, which saves bandwidth. Edit a name to rename the camera. Stream addresses stay the same.</p>
    <div id="camList" class="mt-4 divide-y divide-zinc-800 rounded-2xl bg-zinc-900 ring-1 ring-white/5">
        <p class="px-4 py-3 text-sm text-zinc-500">Loading…</p>
    </div>
    <p id="camStatus" class="mt-3 text-sm text-zinc-400" role="status"></p>
</div>
{% endblock %}

{% block javascript %}
<script src="static/cameras.js"></script>
<script>
    renderCameraToggles(document.getElementById("camList"), document.getElementById("camStatus"))
        .then((ok) => ok || (document.getElementById("camList").innerHTML = '<p class="px-4 py-3 text-sm text-zinc-500">No cameras found on this Wyze account.</p>'));
</script>
{% endblock %}
