{% extends 'base.html' %}

{% block content %}
<header class="mb-6 flex flex-wrap items-center gap-3 pt-2">
    <h1 class="page-title">Cameras</h1>
</header>

<div class="mx-auto max-w-xl">
    <p class="text-sm text-zinc-400">Unchecked cameras are hidden and don't stream, which saves bandwidth.</p>
    <div id="camList" class="mt-4 divide-y divide-zinc-800 surface">
        <p class="px-4 py-3 text-sm text-zinc-500">Loading…</p>
    </div>
    <p id="camStatus" class="mt-3 text-sm text-zinc-400" role="status"></p>
</div>
{% endblock %}

{% block javascript %}
<script src="static/cameras.js"></script>
<script>
    renderCameraToggles(document.getElementById("camList"), document.getElementById("camStatus"))
        .then((ok) => ok || (document.getElementById("camList").innerHTML = '<p class="px-4 py-3 text-sm text-zinc-500">No cameras found on this Wyze account.</p>'));
</script>
{% endblock %}
