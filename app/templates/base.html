<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 antialiased">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
        // Theme: "light", "dark", or unset to follow the system. Runs before paint to avoid a flash.
        (() => {
            const icons = { light: "fa-sun", dark: "fa-moon" }, next = { light: "dark", dark: "", "": "light" };
            const get = () => { try { return localStorage.getItem("theme") || ""; } catch { return ""; } };
            const apply = (t) => {
                t ? document.documentElement.dataset.theme = t : delete document.documentElement.dataset.theme;
                document.querySelectorAll(".theme-toggle").forEach((b) => {
                    b.querySelector("i").className = "fas " + (icons[t] || "fa-circle-half-stroke");
                    b.title = "Theme: " + (t || "system");
                });
            };
            apply(get());
            document.addEventListener("DOMContentLoaded", () => apply(get()));
            document.addEventListener("click", (e) => {
                if (!e.target.closest(".theme-toggle")) return;
                const t = next[get()];
                try { t ? localStorage.setItem("theme", t) : localStorage.removeItem("theme"); } catch { }
                apply(t);
            });
        })();
    </script>
    <title>Wyze Tunnel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="static/tailwind.css" />
    <link rel="stylesheet" href="static/site.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    {% block stylesheet %}
    {% endblock %}
</head>

<body class="flex min-h-full flex-col text-zinc-100" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif">
    <main class="section mx-auto w-full max-w-screen-2xl flex-1 px-4 py-6 sm:px-6">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="footer fs-display-none border-t border-white/5 px-4 py-6 text-center text-sm text-zinc-500">
        {% block api_info %}
        {% endblock %}
        <p class="mt-2 flex items-center justify-center gap-2">
            <a class="font-semibold text-zinc-300 hover:text-white" href="https://github.com/itskiwi/Wyze-Tunnel">
                <i class="fa-brands fa-github"></i> Wyze Tunnel</a>
            <span>v{{ version }}</span>
            <button id="checkUpdate" class="hover:text-white" title="Check for updates" data-version="{{version}}">
                <i class="fas fa-arrows-rotate"></i></button>
        </p>
        <p class="mt-1 text-xs">Based on <a class="hover:text-zinc-300 underline underline-offset-2"
                href="https://github.com/mrlt8/docker-wyze-bridge">docker-wyze-bridge</a> by mrlt8.</p>
    </footer>
    <div id="toasts" class="pointer-events-none fixed bottom-20 right-4 z-50 flex w-80 max-w-[calc(100vw-2rem)] flex-col gap-2"></div>
    {% block javascript %}
    {% endblock %}
</body>

</html>
