<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 antialiased">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Shared clip</title>
    <link rel="icon" href="../static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../static/tailwind.css" />
    <link rel="stylesheet" href="../static/site.css" />
</head>

<body class="grid min-h-full place-items-center p-4 font-sans text-[15px] text-zinc-100">
    <main class="surface w-full max-w-sm p-6">
        <h1 class="font-display text-xl font-extrabold text-zinc-50">This clip has a password</h1>
        <p class="mt-2 text-sm text-zinc-400">Whoever sent you the link has it.</p>
        <form method="get" class="mt-4 flex gap-2">
            <input name="p" type="password" required autofocus autocomplete="off" aria-label="Password" class="field min-w-0 flex-1" />
            <button class="btn btn-primary" type="submit">Watch</button>
        </form>
        {% if wrong %}<p class="mt-3 text-sm text-amber-200" role="alert">That password isn't right.</p>{% endif %}
    </main>
</body>

</html>
